<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>延陵世家——凉水埠吴氏家谱</title>
  <meta name="description" content="凉水埠吴氏家族家谱互动可视化">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: linear-gradient(180deg, #1a1a1f 0%, #0d0d11 100%);
      color: #c0c0c0;
      font-family: 'Noto Serif SC', 'Songti SC', 'Noto Serif CJK SC', SimSun, serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none
    }

    #tree-canvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0
    }

    svg {
      width: 100%;
      height: 100%
    }

    .node-circle {
      cursor: pointer;
      transition: filter .3s
    }

    .node-circle:hover {
      filter: drop-shadow(0 0 8px rgba(212, 175, 55, .6))
    }

    .node-label {
      fill: #D4AF37;
      font-family: 'Noto Serif SC', serif;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600
    }

    .node-gen-label {
      fill: #909090;
      font-family: 'Noto Serif SC', serif;
      font-size: 10px
    }

    .link-line {
      fill: none;
      stroke: #505058;
      stroke-width: 1.5;
      opacity: .6
    }

    .link-line.search-path, .kinship-trace {
      stroke: #FF8C00;
      stroke-width: 4;
      opacity: 1;
    }

    .kinship-trace {
      fill: none;
      pointer-events: none;
      stroke-linecap: round;
      stroke-dasharray: 1 1;
      stroke-dashoffset: 1;
      animation: kinship-trace var(--trace-step) linear var(--trace-delay) forwards;
    }

    @keyframes kinship-trace {
      to { stroke-dashoffset: 0; }
    }

    .kinship-flower { pointer-events: none; }
    .kinship-flower.is-blooming {
      transform-box: fill-box;
      transform-origin: center;
      animation: kinship-bloom 440ms ease-out var(--bloom-delay) both;
    }

    @keyframes kinship-bloom {
      0% { opacity: 0; transform: scale(.2); }
      68% { opacity: 1; transform: scale(1.16); }
      100% { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .kinship-trace { animation: none; stroke-dashoffset: 0; }
      .kinship-flower.is-blooming { animation: none; }
    }

    #github-edit-dialog {
      margin: auto;
      max-width: min(420px, calc(100vw - 32px));
      padding: 20px;
      color: #e0dcd0;
      background: #17171e;
      border: 1px solid #807043;
      border-radius: 10px;
      font-size: 14px;
    }

    #github-edit-dialog::backdrop { background: rgba(0, 0, 0, .72); }

    #github-edit-dialog p { margin: 8px 0; }
    #github-edit-dialog a, #info-desc a { color: #efc76b; }
    #github-token { display: block; width: 100%; margin: 10px 0; padding: 8px; }
    #info-desc { user-select: text; overflow-wrap: anywhere; }
    .note-limit { color: #adadad; font-size: 11px; }
    .note-limit[aria-invalid="true"] { color: #ff7777; }

    .search-highlight .node-label {
      fill: #FF8C00 !important
    }

    .search-highlight .node-circle {
      fill: #FF8C00 !important;
      stroke: #FF8C00 !important
    }

    /* Control Panel */
    #control-panel {
      position: fixed;
      left: 16px;
      bottom: 16px;
      width: 220px;
      background: rgba(20, 20, 28, .92);
      border: 1px solid rgba(212, 175, 55, .25);
      border-radius: 12px;
      padding: 16px;
      z-index: 100;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .5)
    }

    #control-panel h1 {
      color: #D4AF37;
      font-size: 20px;
      line-height: 1.3;
      margin-bottom: 2px;
      text-shadow: 0 0 12px rgba(212, 175, 55, .3)
    }

    #control-panel .stats {
      color: #808080;
      font-size: 11px;
      margin-bottom: 10px
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px
    }

    .ctrl-btn {
      background: rgba(212, 175, 55, .1);
      border: 1px solid rgba(212, 175, 55, .3);
      color: #D4AF37;
      padding: 7px 0;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Noto Serif SC', serif;
      font-size: 12px;
      transition: all .2s
    }

    .ctrl-btn:hover {
      background: rgba(212, 175, 55, .2);
      border-color: rgba(212, 175, 55, .5)
    }

    .ctrl-btn:active {
      transform: scale(.96)
    }

    #data-file-button {
      display: none;
      width: 100%;
      margin: 0 0 10px;
      padding: 8px;
      background: rgba(255, 140, 0, .12);
      border: 1px solid rgba(255, 140, 0, .45);
      border-radius: 6px;
      color: #ffad42;
      cursor: pointer;
      font-family: 'Noto Serif SC', serif;
      font-size: 12px;
    }

    #data-file-button:hover {
      background: rgba(255, 140, 0, .2);
    }

    #data-file-button.connected {
      border-color: rgba(80, 180, 110, .5);
      color: #7bd692;
      cursor: default;
    }

    #save-status {
      min-height: 16px;
      margin: -4px 0 8px;
      color: #808080;
      font-size: 10px;
      text-align: center;
    }

    /* Minimap */
    #minimap-container {
      width: 100%;
      height: 90px;
      background: rgba(0, 0, 0, .4);
      border: 1px solid rgba(100, 100, 100, .3);
      border-radius: 6px;
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
      cursor: crosshair
    }

    #minimap-canvas {
      width: 100%;
      height: 100%
    }

    #minimap-viewport {
      position: absolute;
      border: 1.5px solid #FF8C00;
      background: rgba(255, 140, 0, .08);
      pointer-events: none;
      border-radius: 2px
    }

    /* Search */
    #search-wrap {
      position: relative
    }

    #search-input {
      width: 100%;
      background: rgba(30, 30, 40, .8);
      border: 1px solid rgba(100, 100, 100, .3);
      color: #c0c0c0;
      padding: 7px 10px 7px 30px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      font-family: 'Noto Serif SC', serif
    }

    #search-input:focus {
      border-color: rgba(212, 175, 55, .4)
    }

    #search-icon {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: #606060;
      font-size: 13px;
      pointer-events: none
    }

    #search-results {
      position: absolute;
      bottom: calc(100% + 4px);
      left: 0;
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      background: rgba(20, 20, 28, .95);
      border: 1px solid rgba(100, 100, 100, .3);
      border-radius: 6px;
      display: none;
      z-index: 200
    }

    #search-results::-webkit-scrollbar {
      width: 4px
    }

    #search-results::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, .3);
      border-radius: 2px
    }

    .search-item {
      display: block;
      width: 100%;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 12px;
      color: #b0b0b0;
      text-align: left;
      font-family: inherit;
      background: transparent;
      border: 0;
      border-bottom: 1px solid rgba(60, 60, 60, .3);
      transition: background .15s
    }

    .search-item:hover, .search-item:focus-visible {
      background: rgba(212, 175, 55, .1);
      color: #D4AF37
    }

    .search-item .gen {
      color: #707070;
      font-size: 10px;
      margin-left: 6px
    }

    /* Info Panel */
    #info-panel {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 310px;
      max-height: 560px;
      background: rgba(20, 20, 28, .94);
      border: 1px solid rgba(212, 175, 55, .2);
      border-radius: 12px;
      padding: 16px;
      z-index: 100;
      backdrop-filter: blur(12px);
      display: none;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .5);
      overflow-y: auto
    }

    #info-panel::-webkit-scrollbar {
      width: 4px
    }

    #info-panel::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, .3);
      border-radius: 2px
    }

    #info-name {
      color: #D4AF37;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      line-height: 1.4
    }

    #info-gen {
      color: #909090;
      font-size: 12px;
      margin-bottom: 8px
    }

    #info-descendants {
      color: #707070;
      font-size: 11px;
      margin-bottom: 8px
    }

    #info-desc {
      color: #a0a0a0;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      margin-bottom: 8px;
      min-height: 20px;
      border-top: 1px solid rgba(80, 80, 80, .3);
      padding-top: 8px
    }

    #info-edit-btn {
      background: rgba(212, 175, 55, .12);
      border: 1px solid rgba(212, 175, 55, .3);
      color: #D4AF37;
      padding: 5px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-family: 'Noto Serif SC', serif;
      font-size: 11px;
      transition: all .2s
    }

    #info-edit-btn:hover {
      background: rgba(212, 175, 55, .22)
    }

    #info-edit-fields {
      display: none;
      border-top: 1px solid rgba(80, 80, 80, .3);
      padding-top: 10px;
    }

    #info-edit-fields label {
      display: block;
      margin: 8px 0 4px;
      color: #909090;
      font-size: 11px;
    }

    #info-name-input,
    #info-gen-input,
    #info-textarea {
      width: 100%;
      background: rgba(30, 30, 40, .8);
      border: 1px solid rgba(100, 100, 100, .4);
      color: #c0c0c0;
      padding: 8px;
      border-radius: 5px;
      font-size: 12px;
      font-family: 'Noto Serif SC', serif;
      outline: none;
      line-height: 1.6
    }

    #info-textarea {
      min-height: 80px;
      resize: vertical;
    }

    #info-edit-actions {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 10px;
    }

    #info-save-btn,
    #info-add-child-btn,
    #info-delete-btn,
    #info-cancel-btn {
      background: rgba(212, 175, 55, .15);
      border: 1px solid rgba(212, 175, 55, .35);
      color: #D4AF37;
      padding: 5px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-family: 'Noto Serif SC', serif;
      font-size: 11px;
      padding: 7px 8px;
      transition: all .2s
    }

    #info-save-btn:hover,
    #info-add-child-btn:hover {
      background: rgba(212, 175, 55, .25)
    }

    #info-delete-btn {
      color: #ff7777;
      border-color: rgba(255, 107, 107, .35);
      background: rgba(255, 107, 107, .08);
    }

    #info-delete-btn:hover {
      background: rgba(255, 107, 107, .18);
    }

    #info-cancel-btn {
      color: #909090;
      border-color: rgba(120, 120, 120, .3);
      background: rgba(120, 120, 120, .08);
    }

    #info-close {
      position: absolute;
      top: 10px;
      right: 12px;
      color: #606060;
      cursor: pointer;
      font-size: 16px;
      line-height: 1
    }

    #info-close:hover {
      color: #D4AF37
    }

    /* Password Overlay */
    #pwd-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 10, 15, .97);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #pwd-overlay h2 {
      color: #D4AF37;
      font-size: 22px;
      margin-bottom: 20px;
      text-shadow: 0 0 12px rgba(212, 175, 55, .3);
    }

    #pwd-overlay input {
      width: 260px;
      padding: 10px 14px;
      background: rgba(30, 30, 40, .8);
      border: 1px solid rgba(212, 175, 55, .3);
      color: #c0c0c0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      font-family: 'Noto Serif SC', serif;
      text-align: center;
    }

    #pwd-overlay input:focus {
      border-color: rgba(212, 175, 55, .6);
    }

    #pwd-overlay .pwd-btn {
      margin-top: 14px;
      padding: 8px 40px;
      background: rgba(212, 175, 55, .15);
      border: 1px solid rgba(212, 175, 55, .4);
      color: #D4AF37;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-family: 'Noto Serif SC', serif;
    }

    #pwd-overlay .pwd-btn:hover {
      background: rgba(212, 175, 55, .25);
    }

    #pwd-overlay .pwd-error {
      color: #ff6b6b;
      font-size: 12px;
      margin-top: 10px;
      min-height: 18px;
    }

    /* Add Node Dialog */
    #add-node-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, .6);
      z-index: 8500;
      display: none;
      align-items: center;
      justify-content: center;
    }

    #add-node-dialog {
      width: 360px;
      background: rgba(20, 20, 28, .96);
      border: 1px solid rgba(212, 175, 55, .25);
      border-radius: 14px;
      padding: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 40px rgba(0, 0, 0, .6);
      position: relative;
    }

    #add-node-dialog h3 {
      color: #D4AF37;
      font-size: 16px;
      margin: 0 0 16px 0;
    }

    #add-node-dialog label {
      color: #a0a0a0;
      font-size: 12px;
      display: block;
      margin-bottom: 4px;
    }

    #add-node-dialog input,
    #add-node-dialog textarea {
      width: 100%;
      background: rgba(30, 30, 40, .8);
      border: 1px solid rgba(100, 100, 100, .3);
      color: #c0c0c0;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      font-family: 'Noto Serif SC', serif;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    #add-node-dialog textarea {
      height: 60px;
      resize: vertical;
    }

    #add-node-dialog input:focus,
    #add-node-dialog textarea:focus {
      border-color: rgba(212, 175, 55, .4);
    }

    .dialog-btns {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .dialog-btn {
      padding: 7px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-family: 'Noto Serif SC', serif;
      border: 1px solid;
    }

    .dialog-btn.primary {
      background: rgba(212, 175, 55, .15);
      border-color: rgba(212, 175, 55, .4);
      color: #D4AF37;
    }

    .dialog-btn.primary:hover {
      background: rgba(212, 175, 55, .25);
    }

    .dialog-btn.cancel {
      background: transparent;
      border-color: rgba(100, 100, 100, .3);
      color: #808080;
    }

    .dialog-btn.cancel:hover {
      border-color: rgba(100, 100, 100, .5);
      color: #a0a0a0;
    }

    #info-close {
      padding: 0;
      border: 0;
      background: transparent;
    }

    @media (max-width: 640px), (max-height: 480px) and (pointer: coarse) {
      body {
        height: 100dvh;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        font-family: "Songti SC", "Noto Serif CJK SC", SimSun, serif;
      }

      #tree-canvas svg { touch-action: none; }

      #control-panel {
        top: max(8px, env(safe-area-inset-top));
        left: max(8px, env(safe-area-inset-left));
        right: max(8px, env(safe-area-inset-right));
        bottom: auto;
        width: auto;
        padding: 8px;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 6px;
        background: #17171e;
        backdrop-filter: none;
      }

      #control-panel h1 { margin: 0; font-size: 16px; }
      #control-panel h1 br, #minimap-container, #save-status:empty { display: none; }
      #control-panel .stats { margin: 0; text-align: right; }
      #data-file-button, #save-status, .btn-grid, #search-wrap { grid-column: 1 / -1; margin: 0; }
      #search-wrap { order: 1; }
      .btn-grid { order: 2; grid-template-columns: repeat(4, minmax(0, 1fr)); }
      #save-status { order: 3; }
      .ctrl-btn, #search-input, #data-file-button { min-height: 44px; }
      .ctrl-btn { font-size: 13px; }
      #search-input { font-size: 16px; }

      #search-results {
        top: calc(100% + 4px);
        bottom: auto;
        max-height: min(280px, 46vh);
        max-height: max(48px, min(280px, calc(var(--tree-visible-height, 100dvh) - 100px)));
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        background: #17171e;
      }

      .search-item { min-height: 44px; padding: 11px 12px; font-size: 15px; }
      .search-item .gen { font-size: 12px; }

      #info-panel {
        left: max(8px, env(safe-area-inset-left));
        right: max(8px, env(safe-area-inset-right));
        bottom: calc(max(8px, env(safe-area-inset-bottom)) + var(--tree-keyboard-inset, 0px));
        width: auto;
        max-height: 48vh;
        max-height: min(48dvh, max(130px, calc(var(--tree-visible-height, 100dvh) - 140px)));
        padding: 12px 14px;
        z-index: 110;
        background: #17171e;
        backdrop-filter: none;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        scroll-padding: 8px;
      }

      #info-panel.is-editing {
        max-height: 72vh;
        max-height: min(72dvh, max(130px, calc(var(--tree-visible-height, 100dvh) - 20px)));
      }

      #info-name { font-size: 18px; }
      #info-desc { margin-bottom: 12px; font-size: 15px; color: #c9c5ba; line-height: 1.65; }
      #info-close {
        position: sticky;
        z-index: 1;
        top: 0;
        float: right;
        width: 44px;
        height: 44px;
        margin: -4px -4px 4px 8px;
        color: #c0c0c0;
        background: #23232b;
        border-radius: 8px;
      }

      #info-edit-btn, #info-edit-actions button, .dialog-btn, #pwd-overlay .pwd-btn { min-height: 44px; }
      #info-name-input, #info-gen-input, #info-textarea, #pwd-overlay input,
      #add-node-dialog input, #add-node-dialog textarea, #github-token { font-size: 16px; }
      #pwd-overlay { padding: 16px; }
      #pwd-overlay h2 { text-align: center; font-size: 19px; }
      #pwd-overlay input { max-width: 100%; }
      #add-node-overlay { bottom: var(--tree-keyboard-inset, 0px); padding: 12px; }
      #add-node-dialog, #github-edit-dialog {
        max-width: 100%;
        max-height: calc(var(--tree-visible-height, 100dvh) - 24px);
        overflow-y: auto;
      }
      #github-edit-dialog { max-width: calc(100% - 24px); }
    }
  </style>
</head>

<body>
  <div id="tree-canvas"></div>

  <!-- Control Panel -->
  <div id="control-panel">
    <h1>延陵世家<br> 凉水埠吴氏家谱</h1>
    <div class="stats" id="stats-line">加载中…</div>
    <button id="data-file-button" type="button">连接 JSON，启用直接保存</button>
    <input id="data-file-input" type="file" accept="application/json,.json" hidden>
    <div id="save-status" role="status"></div>
    <div class="btn-grid">
      <button class="ctrl-btn" id="btn-expand" title="展开全部">展开全部</button>
      <button class="ctrl-btn" id="btn-collapse" title="收起全部">收起全部</button>
      <button class="ctrl-btn" id="btn-zoomin" title="放大">放 大</button>
      <button class="ctrl-btn" id="btn-zoomout" title="缩小">缩 小</button>
    </div>
    <div id="minimap-container">
      <canvas id="minimap-canvas"></canvas>
      <div id="minimap-viewport"></div>
    </div>
    <div id="search-wrap">
      <span id="search-icon">🔍</span>
      <input id="search-input" type="search" placeholder="搜索人名或拼音…" aria-label="搜索人名或拼音" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <div id="search-results"></div>
    </div>
  </div>

  <!-- Password Overlay -->
  <div id="pwd-overlay">
    <h2>延陵世家 · 凉水埠吴氏家谱</h2>
    <input id="pwd-input" type="password" placeholder="请输入访问密码">
    <button class="pwd-btn" id="pwd-btn">进 入</button>
    <div class="pwd-error" id="pwd-error"></div>
  </div>

  <!-- Add Node Dialog -->
  <div id="add-node-overlay">
    <div id="add-node-dialog">
      <h3 id="add-dialog-title">添加子节点</h3>
      <label>姓名</label>
      <input id="add-name" type="text" placeholder="如：吴某某，妻李氏">
      <label>世代</label>
      <input id="add-gen" type="text" placeholder="如：8世（修）">
      <label>备注</label>
      <textarea id="add-note" placeholder="可选备注信息…"></textarea>
      <p id="add-note-limit" class="note-limit"></p>
      <div class="dialog-btns">
        <button class="dialog-btn cancel" id="add-cancel">取消</button>
        <button class="dialog-btn primary" id="add-confirm">确认添加</button>
      </div>
    </div>
  </div>

  <!-- Info Panel -->

  <dialog id="github-edit-dialog">
    <form id="github-edit-form">

      <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">在 GitHub 创建令牌</a>
      <input id="github-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <p id="github-edit-message" role="status"></p>
      <button type="submit" class="dialog-btn primary">授权编辑</button>
      <button id="github-edit-cancel" type="button" class="dialog-btn cancel">取消</button>

  <script src="vendor/d3-7.9.2/dist/d3.min.js"></script>
  <script defer src="vendor/pinyin-pro-3.29.5/dist/index.js"></script>
  <script>
    // ====== Password Gate ======
    (function () {
      const overlay = document.getElementById('pwd-overlay');
      const input = document.getElementById('pwd-input');
      const btn = document.getElementById('pwd-btn');
      const err = document.getElementById('pwd-error');
      function tryLogin() {
        if (input.value === 'wujiachaguan') {
          input.blur();
          overlay.style.display = 'none';
        } else {
          err.textContent = '密码错误，请重试';
          input.value = '';
          input.focus();
        }
      }
      btn.addEventListener('click', tryLogin);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
      if (!window.matchMedia('(pointer: coarse)').matches) input.focus();
    })();

    const compactTreeView = window.matchMedia('(max-width: 640px), (max-height: 480px) and (pointer: coarse)');
    const visualView = window.visualViewport;
    if (visualView) {
      const updateVisibleHeight = () => {
        if (!compactTreeView.matches || visualView.scale !== 1) return;
        const styles = document.documentElement.style;
        styles.setProperty('--tree-visible-height', visualView.height + 'px');
        styles.setProperty('--tree-keyboard-inset', Math.max(0,
          document.documentElement.clientHeight - visualView.height - visualView.offsetTop) + 'px');
      };
      visualView.addEventListener('resize', updateVisibleHeight);
      visualView.addEventListener('scroll', updateVisibleHeight);
      updateVisibleHeight();
    }

    // ====== Data File Configuration ======
    const DATA_FILE = '延陵世家——凉水埠吴氏家谱-db_20260808.json';
    const IS_GITHUB_PAGES = location.origin === 'https://himrhow.github.io' &&
      location.pathname.startsWith('/family-tree/');
    const GITHUB_CONTENTS = 'https://api.github.com/repos/HiMrHOW/family-tree/contents/family_data.json';
    let DATA = null;
    let dataFileHandle = null;
    let githubToken = '';
    let githubFileSha = '';
    let loadedFileText = '';
    let saving = false;
    let appInitialized = false;
    const dataFileButton = document.getElementById('data-file-button');
    const dataFileInput = document.getElementById('data-file-input');
    const saveStatus = document.getElementById('save-status');

    function showLoadRetry(message) {
      const stats = document.getElementById('stats-line');
      const retry = document.createElement('button');
      retry.type = 'button';
      retry.className = 'ctrl-btn';
      retry.style.paddingInline = '8px';
      retry.textContent = '重试';
      retry.addEventListener('click', () => location.reload());
      stats.replaceChildren(message + ' ', retry);
    }

    function showDataFileButton(message) {
      if (message && !IS_GITHUB_PAGES) saveStatus.textContent = message;
      if (!IS_GITHUB_PAGES) dataFileButton.style.display = 'block';
    }

    function setConnectedState(fileName) {
      dataFileButton.textContent = '✓ 已连接：' + fileName;
      dataFileButton.classList.add('connected');
      saveStatus.textContent = '页面编辑将自动写入此 JSON 文件';
    }

    function loadSelectedFileReadOnly(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          initApp(JSON.parse(reader.result));
          dataFileButton.textContent = '当前浏览器不支持直接写入 JSON';
          saveStatus.textContent = '请使用最新版 Chrome 或 Edge 打开页面';
        } catch (e) {
          console.error('Invalid JSON data file:', e);
          document.getElementById('stats-line').textContent = 'JSON 文件格式无效，请重新选择';
        }
      };
      reader.onerror = () => {
        document.getElementById('stats-line').textContent = '无法读取 JSON 文件，请重新选择';
      };
      reader.readAsText(file, 'UTF-8');
    }

    async function connectEditableDataFile() {
      if (dataFileHandle) return true;
      if (!window.showOpenFilePicker) {
        dataFileInput.click();
        return false;
      }
      try {
        const handles = await window.showOpenFilePicker({
          multiple: false,
          types: [{
            description: '家谱 JSON 数据',
            accept: { 'application/json': ['.json'] }
          }]
        });
        const handle = handles[0];
        const file = await handle.getFile();
        const selectedData = JSON.parse(await file.text());
        if (DATA && selectedData.id !== DATA.id) {
          alert('所选 JSON 不是当前家谱数据文件，请重新选择。');
          return false;
        }
        if (DATA) {
          const currentContent = JSON.stringify(buildPersistableTree(DATA));
          const selectedContent = JSON.stringify(buildPersistableTree(selectedData));
          if (currentContent !== selectedContent) {
            alert('所选 JSON 与页面当前加载的数据不一致。为防止覆盖，请选择与页面对应的 JSON 文件。');
            return false;
          }
        }
        dataFileHandle = handle;
        if (!appInitialized) initApp(selectedData);
        setConnectedState(file.name);
        return true;
      } catch (e) {
        if (e.name !== 'AbortError') {
          console.error('Failed to open writable JSON file:', e);
          saveStatus.textContent = 'JSON 文件连接失败，请重试';
        }
        return false;
      }
    }

    function buildPersistableTree(data, depth = 0) {
      const { _children_all, _children_visible, _expanded, children, ...node } = data;
      const currentChildren = _children_all === undefined ? children || [] : _children_all || [];
      if (!node.generation) delete node.generation;
      if (!node.note) delete node.note;
      const savedChildren = currentChildren.map(child => buildPersistableTree(child, depth + 1));
      if (savedChildren.length > 0) node.children = savedChildren;
      node.dc = savedChildren.reduce((total, child) => total + 1 + child.dc, 0);
      node.depth = depth;
      return node;
    }

    const githubDialog = document.getElementById('github-edit-dialog');
    const githubForm = document.getElementById('github-edit-form');
    const tokenInput = document.getElementById('github-token');
    const githubMessage = document.getElementById('github-edit-message');

    document.getElementById('github-edit-cancel').onclick = () => githubDialog.close();
    githubDialog.addEventListener('close', () => { tokenInput.value = ''; });

    function githubRequest(token, options = {}) {
      return fetch(GITHUB_CONTENTS, {
        ...options,
        cache: 'no-store',
        redirect: 'error',
        headers: {
          Accept: 'application/vnd.github+json',
          Authorization: 'Bearer ' + token,
          ...options.headers
        }
      });
    }

    githubForm.addEventListener('submit', async event => {
      event.preventDefault();
      const token = tokenInput.value.trim();
      tokenInput.value = '';
      const submit = githubForm.querySelector('[type=submit]');
      submit.disabled = true;
      githubMessage.textContent = '正在核对 GitHub 数据…';
      try {
        const response = await githubRequest(token, {
          headers: { Accept: 'application/vnd.github.raw+json' }
        });
        if (!response.ok) throw new Error('GitHub 拒绝授权或读取（' + response.status + '）。');
        const text = await response.text();
        if (text !== loadedFileText) {
          throw new Error('网页和 GitHub 数据版本不同，请等待部署完成后刷新。');
        }
        const bytes = new TextEncoder().encode(text);
        const blob = new Blob(['blob ' + bytes.length + '\0', bytes]);
        const digest = await crypto.subtle.digest('SHA-1', await blob.arrayBuffer());
        if (!githubDialog.open) return;
        githubFileSha = Array.from(new Uint8Array(digest), byte =>
          byte.toString(16).padStart(2, '0')).join('');
        githubToken = token;
        githubDialog.close();
        const editButton = document.getElementById('info-edit-btn');
        if (editButton.style.display !== 'none') editButton.click();
      } catch (error) {
        githubMessage.textContent = error.message;
      } finally {
        submit.disabled = false;
      }
    });

    async function saveToGitHub(json) {
      const bytes = new TextEncoder().encode(json);
      let binary = '';
      for (let i = 0; i < bytes.length; i += 8192) {
        binary += String.fromCharCode(...bytes.subarray(i, i + 8192));
      }
      const response = await githubRequest(githubToken, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: '更新家谱人物资料',
          branch: 'main',
          sha: githubFileSha,
          content: btoa(binary)
        })
      });
      if (response.status === 409 || response.status === 422) {
        throw new Error('GitHub 未接受写入，资料可能已更新。请先复制刚编辑的内容，再刷新核对。');
      }
      if (response.status === 401 || response.status === 403 || response.status === 404) {
        githubToken = '';
        throw new Error('GitHub 写入失败，请检查令牌的仓库范围和 Contents 写入权限。');
      }
      if (!response.ok) throw new Error('GitHub 保存失败（' + response.status + '）。');
      const result = await response.json();
      githubFileSha = result.content.sha;
      loadedFileText = json;
    }

    async function saveDataDirectly() {
      if (saving || !DATA || !requireWritableFile()) return false;
      saving = true;
      saveStatus.textContent = '正在保存…';
      try {
        const json = JSON.stringify(buildPersistableTree(DATA), null, 2);
        if (IS_GITHUB_PAGES) {
          await saveToGitHub(json);
          saveStatus.textContent = '✓ 已提交到 GitHub，网页随后更新';
        } else {
          const writable = await dataFileHandle.createWritable();
          await writable.write(json);
          await writable.close();
          saveStatus.textContent = '✓ 已直接保存到 JSON 文件';
        }
        return true;
      } catch (e) {
        saveStatus.textContent = IS_GITHUB_PAGES ? e.message : '无法写入 JSON 文件，请检查文件权限后重试。';
        return false;
      } finally {
        saving = false;
      }
    }

    function requireWritableFile() {
      if (IS_GITHUB_PAGES) {
        if (githubToken) return true;
        githubMessage.textContent = '';
        if (!githubDialog.open) githubDialog.showModal();
        return false;
      }
      if (dataFileHandle) return true;
      alert('编辑前请先点击“连接 JSON，启用直接保存”，并选择家谱 JSON 文件。');
      return false;
    }

    dataFileButton.addEventListener('click', connectEditableDataFile);
    dataFileInput.addEventListener('change', () => loadSelectedFileReadOnly(dataFileInput.files[0]));

    if (location.protocol === 'file:') {
      document.getElementById('stats-line').textContent = '请先连接家谱 JSON 文件';
      showDataFileButton('选择文件一次，之后每次编辑都会直接保存');
    } else {
      const dataUrl = IS_GITHUB_PAGES ? 'family_data.json?v=' + Date.now() : encodeURI(DATA_FILE);
      fetch(dataUrl, { cache: 'no-store' })
        .then(r => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(text => {
          loadedFileText = text;
          initApp(JSON.parse(text));
        })
        .catch(e => {
          console.error('Failed to load ' + DATA_FILE + ':', e);
          if (IS_GITHUB_PAGES) {
            showLoadRetry('家谱数据暂未加载');
          } else {
            document.getElementById('stats-line').textContent = '数据加载失败：' + DATA_FILE;
            showDataFileButton('请选择家谱 JSON 文件');
          }
        });
    }

    function initApp(loadedData) {
      if (appInitialized) return;
      if (!window.d3) {
        showLoadRetry('家谱图暂未加载');
        return;
      }
      appInitialized = true;
      DATA = loadedData;
      showDataFileButton();
      // ====== Flatten & Statistics ======
      const allNodes = [];
      const genSet = new Set();
      function walk(node) {
        allNodes.push(node);
        if (node.generation) genSet.add(node.generation);
        if (node.children) node.children.forEach(walk);
      }
      walk(DATA);
      const totalPersons = allNodes.length;
      const totalGens = genSet.size;
      document.getElementById('stats-line').textContent = `共 ${totalPersons} 人，${totalGens} 代`;

      // ====== D3 Setup ======
      const container = document.getElementById('tree-canvas');
      let width = container.clientWidth;
      let height = container.clientHeight;

      const svg = d3.select('#tree-canvas').append('svg')
        .attr('width', width).attr('height', height);

      const defs = svg.append('defs');
      // Glow filter
      const glowFilter = defs.append('filter').attr('id', 'glow');
      glowFilter.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'blur');
      glowFilter.append('feMerge').selectAll('feMergeNode')
        .data(['blur', 'SourceGraphic']).enter()
        .append('feMergeNode').attr('in', d => d);

      const g = svg.append('g').attr('class', 'tree-group');

      const zoom = d3.zoom()
        .scaleExtent([0.05, 3])
        .on('zoom', e => {
          g.attr('transform', e.transform);
          updateMinimap();
        });
      svg.call(zoom);
      function resizeTree() {
        const nextWidth = container.clientWidth;
        const nextHeight = container.clientHeight;
        if (!nextWidth || !nextHeight || (width === nextWidth && height === nextHeight)) return;
        const shiftX = (nextWidth - width) / 2;
        const shiftY = (nextHeight - height) / 2;
        const { x, y, k } = d3.zoomTransform(svg.node());
        width = nextWidth;
        height = nextHeight;
        svg.interrupt().attr('width', width).attr('height', height)
          .call(zoom.transform, d3.zoomIdentity.translate(x + shiftX, y + shiftY).scale(k));
      }
      window.addEventListener('resize', resizeTree);
      if ('ResizeObserver' in window) new ResizeObserver(resizeTree).observe(container);

      // ====== Tree Hierarchy ======
      const root = d3.hierarchy(DATA, d => d._children_visible);
      // Initialize: collapse all except root
      function initCollapse(node) {
        if (node.data.children && node.data.children.length > 0) {
          node.data._children_all = node.data.children;
          node.data._children_visible = null; // collapsed
          node.data._expanded = false;
        } else {
          node.data._children_all = null;
          node.data._children_visible = null;
          node.data._expanded = false;
        }
        if (node.data.children) {
          // Temporarily make hierarchy to recurse
          const tempChildren = node.data.children.map(c => d3.hierarchy(c));
          tempChildren.forEach(tc => initCollapse(tc));
        }
      }
      function initCollapseData(data) {
        if (data.children && data.children.length > 0) {
          data._children_all = data.children;
          data._children_visible = null;
          data._expanded = false;
          data.children.forEach(initCollapseData);
        } else {
          data._children_all = null;
          data._children_visible = null;
          data._expanded = false;
        }
      }
      initCollapseData(DATA);

      // Layout constants
      const NODE_WIDTH = 90;
      const NODE_H_GAP = 30;
      const ROW_HEIGHT = 120;
      const CIRCLE_R = 7;
      const LEAF_R = 4;

      let currentSelected = null;
      let searchPair = [];
      let searchPath = new Set();
      let searchRevealVersion = 0;
      const reduceKinshipMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const SEARCH_FOCUS_MS = 600;

      function generationRow(label, fallback) {
        const ancestor = (label || '').match(/祖\s*(\d+)\s*世/);
        if (ancestor) return Number(ancestor[1]) - 1;
        const local = (label || '').match(/(?:凉水埠\s*)?(\d+)\s*(?:世|[（(])/);
        return local ? Number(local[1]) + 9 : fallback;
      }

      // ====== Format generation label ======
      function formatGen(gen) {
        if (!gen) return '';
        // e.g. "10世（良）" → "第10世（良字辈）"
        // e.g. "祖5世" → "祖第5世"
        // e.g. "凉水埠1世（大），祖11世" → keep as-is
        return gen;
      }

      // ====== Compute Tree Layout ======
      function computeLayout() {
        const hierarchy = d3.hierarchy(DATA, d => d._children_visible);
        // Use d3.tree with bottom-up orientation
        // We'll compute positions manually for generation rows
        // Assign each node a generation-based y and left-to-right x

        hierarchy.eachBefore(n => {
          n._totalLeafCount = 0;
        });

        // Count leaf width for spacing
        function countLeaves(node) {
          if (!node.children || node.children.length === 0) {
            node._leafCount = 1;
            return 1;
          }
          let total = 0;
          node.children.forEach(c => { total += countLeaves(c); });
          node._leafCount = total;
          return total;
        }
        countLeaves(hierarchy);

        // Assign x positions based on leaf counts
        function assignX(node, leftEdge) {
          if (!node.children || node.children.length === 0) {
            node._x = leftEdge + (NODE_WIDTH + NODE_H_GAP) / 2;
            return leftEdge + NODE_WIDTH + NODE_H_GAP;
          }
          let currentLeft = leftEdge;
          node.children.forEach(c => {
            currentLeft = assignX(c, currentLeft);
          });
          // Center parent above children
          const firstChild = node.children[0];
          const lastChild = node.children[node.children.length - 1];
          node._x = (firstChild._x + lastChild._x) / 2;
          return currentLeft;
        }
        assignX(hierarchy, 0);

        const rows = new Map();
        hierarchy.eachBefore(n => {
          const motherGroup = n.parent && /^\p{Script=Han}{1,3}氏生$/u.test(n.parent.data.name);
          // Children listed under a birth-mother group belong to the group's generation.
          const fallback = n.parent ? n.parent._row + (motherGroup ? 0 : 1) : 0;
          n._row = generationRow(n.data.generation, fallback);
          n._y = -n._row * ROW_HEIGHT;
          if (!rows.has(n._row)) rows.set(n._row, []);
          rows.get(n._row).push(n);
        });
        rows.forEach(row => {
          row.sort((a, b) => a._x - b._x);
          for (let i = 1; i < row.length; i++) {
            row[i]._x = Math.max(row[i]._x, row[i - 1]._x + NODE_WIDTH + NODE_H_GAP);
          }
        });

        return hierarchy;
      }

      // ====== Render ======
      function linkGeometry({ source, target }) {
        const { _x: px, _y: py } = source;
        const { _x: cx, _y: cy } = target;
        if (py === cy) {
          const arcY = py - ROW_HEIGHT / 3;
          return `M${px},${py} C${px},${arcY} ${cx},${arcY} ${cx},${cy}`;
        }
        const midY = py - (py - cy) * 0.4;
        return `M${px},${py - CIRCLE_R - 2}` +
          `C${px},${midY} ${cx},${midY} ${cx},${cy + CIRCLE_R + 14}`;
      }

      function render(sourceNode, searchBranches = null) {
        searchRevealVersion++;
        const hierarchy = computeLayout();
        const nodes = hierarchy.descendants();
        const links = hierarchy.links();
        const depth = searchBranches ? Math.max(...searchBranches.map(branch => branch.length)) : 0;
        const animate = depth > 0 && !reduceKinshipMotion.matches;
        const stepMs = animate ? Math.min(190, 1600 / depth) : 0;
        g.selectAll('.kinship-traces, .kinship-flower').remove();

        // Determine source position for animation
        const sx = sourceNode ? sourceNode._x : (nodes[0] ? nodes[0]._x : 0);
        const sy = sourceNode ? sourceNode._y : (nodes[0] ? nodes[0]._y : 0);

        // ---- Links ----
        const linkSel = g.selectAll('.link-line').data(links, d => d.target.data.id || d.target.data.name);

        linkSel.exit()
          .transition().duration(400)
          .attr('d', d => {
            return `M${sx},${sy}L${sx},${sy}`;
          })
          .remove();

        const linkEnter = linkSel.enter().insert('path', '.node-group')
          .attr('class', 'link-line')
          .attr('d', d => `M${sx},${sy}L${sx},${sy}`);

        linkEnter.merge(linkSel)
          .classed('search-path', d => !animate && searchPath.has(d.target.data.id))
          .transition().duration(400)
          .attr('d', linkGeometry);

        // ---- Nodes ----
        const nodeSel = g.selectAll('.node-group').data(nodes, d => d.data.id || d.data.name);

        nodeSel.exit()
          .transition().duration(400)
          .attr('transform', `translate(${sx},${sy})`)
          .style('opacity', 0)
          .remove();

        const nodeEnter = nodeSel.enter().append('g')
          .attr('class', d => {
            let cls = 'node-group';
            if (searchPair.includes(d.data.id)) cls += ' search-highlight';
            return cls;
          })
          .attr('transform', `translate(${sx},${sy})`)
          .style('opacity', 0);

        // Circle
        nodeEnter.append('circle')
          .attr('class', 'node-circle')
          .attr('cx', 0).attr('cy', 0)
          .attr('r', d => d.data._children_all ? CIRCLE_R : LEAF_R)
          .attr('fill', d => {
            if (!d.data._children_all) return 'transparent';
            return d.data._expanded ? 'transparent' : '#D4AF37';
          })
          .attr('stroke', '#D4AF37')
          .attr('stroke-width', d => d.data._children_all ? 2 : 1.2)
          .on('click', (event, d) => {
            event.stopPropagation();
            toggleNode(d);
          });

        // Name label (above circle)
        nodeEnter.append('text')
          .attr('class', d => {
            let cls = 'node-label';
            return cls;
          })
          .attr('text-anchor', 'middle')
          .attr('y', d => CIRCLE_R + 16)
          .each(function (d) {
            const text = d3.select(this);
            const name = d.data.name || '';
            // Wrap text to NODE_WIDTH
            wrapText(text, name, NODE_WIDTH + 10);
          })
          .on('click', (event, d) => {
            event.stopPropagation();
            showInfoPanel(d);
          });

        // Generation label
        nodeEnter.append('text')
          .attr('class', 'node-gen-label')
          .attr('text-anchor', 'middle')
          .attr('y', d => {
            const nameLines = getTextLines(d.data.name || '', NODE_WIDTH + 10);
            return CIRCLE_R + 16 + nameLines.length * 14 + 4;
          })
          .text(d => formatGen(d.data.generation || ''))
          .style('font-size', '10px');

        // Merge
        const nodeUpdate = nodeEnter.merge(nodeSel);

        nodeUpdate
          .attr('class', d => {
            let cls = 'node-group';
            if (searchPair.includes(d.data.id)) cls += ' search-highlight';
            return cls;
          })
          .transition().duration(400)
          .attr('transform', d => `translate(${d._x},${d._y})`)
          .style('opacity', 1);

        // Update circles
        nodeUpdate.select('circle')
          .transition().duration(300)
          .attr('r', d => d.data._children_all ? CIRCLE_R : LEAF_R)
          .attr('fill', d => {
            if (!d.data._children_all) return 'transparent';
            return d.data._expanded ? 'transparent' : '#D4AF37';
          })
          .attr('stroke', '#D4AF37');

        // Update labels after edits and update search color
        nodeUpdate.select('.node-label')
          .each(function (d) {
            wrapText(d3.select(this), d.data.name || '', NODE_WIDTH + 10);
          });

        nodeUpdate.select('.node-gen-label')
          .attr('y', d => {
            const nameLines = getTextLines(d.data.name || '', NODE_WIDTH + 10);
            return CIRCLE_R + 16 + nameLines.length * 14 + 4;
          })
          .text(d => formatGen(d.data.generation || ''));

        if (animate) {
          const order = new Map(searchBranches.flatMap(branch =>
            branch.map((person, index) => [person.id, index])));
          g.insert('g', '.node-group').attr('class', 'kinship-traces').attr('aria-hidden', 'true')
            .style('--trace-step', stepMs + 'ms')
            .selectAll('path').data(links.filter(d => order.has(d.target.data.id))).join('path')
            .attr('class', 'kinship-trace')
            .attr('d', linkGeometry)
            .attr('pathLength', 1)
            .style('--trace-delay', d => SEARCH_FOCUS_MS + order.get(d.target.data.id) * stepMs + 'ms');
        }

        const endpoints = nodeUpdate.filter(d => searchPair.includes(d.data.id));
        if (searchPair.length === 2 && endpoints.size() === 2) {
          const flowers = endpoints.append('g').attr('class', 'kinship-flower').attr('aria-hidden', 'true')
            .classed('is-blooming', animate);
          if (animate) flowers.style('--bloom-delay', SEARCH_FOCUS_MS + depth * stepMs + 'ms');
          [45, 135, 225, 315].forEach(angle => {
            flowers.append('ellipse')
              .attr('cy', -8).attr('rx', 5.1).attr('ry', 7.3)
              .attr('transform', `rotate(${angle})`).attr('fill', '#FFD64C')
              .attr('stroke', '#DD8A14').attr('stroke-width', 1);
          });
          flowers.append('circle').attr('r', 3.2).attr('fill', '#B56A19');
        }

        setTimeout(updateMinimap, 500);
        return hierarchy;
      }

      // ====== Text wrapping ======
      function getTextLines(text, maxWidth) {
        const chars = text.split('');
        const lines = [];
        let current = '';
        const charsPerLine = Math.floor(maxWidth / 13);
        for (let i = 0; i < chars.length; i++) {
          current += chars[i];
          if (current.length >= charsPerLine) {
            lines.push(current);
            current = '';
          }
        }
        if (current) lines.push(current);
        return lines.length ? lines : [''];
      }

      function wrapText(textEl, text, maxWidth) {
        const lines = getTextLines(text, maxWidth);
        textEl.text(null);
        lines.forEach((line, i) => {
          textEl.append('tspan')
            .attr('x', 0)
            .attr('dy', i === 0 ? '0' : '1.15em')
            .text(line);
        });
      }

      // ====== Toggle expand/collapse ======
      function toggleNode(d) {
        if (!d.data._children_all) {
          showInfoPanel(d);
          return;
        }
        if (d.data._expanded) {
          // Collapse: hide children
          collapseRecursive(d.data);
          d.data._children_visible = null;
          d.data._expanded = false;
        } else {
          // Expand one level
          d.data._children_visible = d.data._children_all;
          d.data._expanded = true;
        }
        const hierarchy = render(d);
        // Center on clicked node
        const targetNode = findNodeInHierarchy(hierarchy, d.data.id || d.data.name);
        showInfoPanel(d);
        if (targetNode) {
          centerOnNode(targetNode._x, targetNode._y);
        }
      }

      function collapseRecursive(data) {
        if (data._children_all) {
          data._children_all.forEach(c => collapseRecursive(c));
        }
        data._children_visible = null;
        data._expanded = false;
      }

      function findNodeInHierarchy(hierarchy, idOrName) {
        let found = null;
        hierarchy.each(n => {
          if ((n.data.id && n.data.id === idOrName) || n.data.name === idOrName) {
            found = n;
          }
        });
        return found;
      }

      // ====== Center view on a position ======
      function treeViewport() {
        if (!compactTreeView.matches) return { top: 0, bottom: height };
        const top = document.getElementById('control-panel').getBoundingClientRect().bottom + 8;
        const details = document.getElementById('info-panel');
        const bottom = details.offsetHeight ? details.getBoundingClientRect().top - 8 : height;
        return bottom > top ? { top, bottom } : { top: 0, bottom: height };
      }

      function centerOnNode(x, y, scale, duration = SEARCH_FOCUS_MS) {
        const s = scale || d3.zoomTransform(svg.node()).k;
        const tx = width / 2 - x * s;
        const { top, bottom } = treeViewport();
        const ty = (top + bottom) / 2 - y * s;
        const transform = d3.zoomIdentity.translate(tx, ty).scale(s);
        if (!duration) {
          svg.interrupt().call(zoom.transform, transform);
          return null;
        }
        return svg.transition().duration(duration).call(zoom.transform, transform);
      }

      // ====== Fit all ======
      function fitAll(zoomMultiplier) {
        const hierarchy = computeLayout();
        const nodes = hierarchy.descendants();
        if (nodes.length === 0) return;
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        nodes.forEach(n => {
          if (n._x < minX) minX = n._x;
          if (n._x > maxX) maxX = n._x;
          if (n._y < minY) minY = n._y;
          if (n._y > maxY) maxY = n._y;
        });
        const treeW = maxX - minX + NODE_WIDTH * 2;
        const treeH = maxY - minY + ROW_HEIGHT;
        const scaleX = (width - 80) / treeW;
        const { top, bottom } = treeViewport();
        const scaleY = Math.max(40, bottom - top - 80) / treeH;
        const s = Math.min(scaleX, scaleY, 1.5) * (zoomMultiplier || 1);
        const cx = (minX + maxX) / 2;
        const cy = (minY + maxY) / 2;
        centerOnNode(cx, cy, s);
      }

      // ====== Expand / Collapse All ======
      function expandAll(data) {
        if (data._children_all) {
          data._children_visible = data._children_all;
          data._expanded = true;
          data._children_all.forEach(expandAll);
        }
      }

      function collapseAll(data) {
        collapseRecursive(data);
      }

      document.getElementById('btn-expand').addEventListener('click', () => {
        expandAll(DATA);
        render(null);
        setTimeout(() => fitAll(20.66), 500); // 9 zoom levels (1.4^9 ≈ 20.66x)
      });

      document.getElementById('btn-collapse').addEventListener('click', () => {
        collapseAll(DATA);
        render(null);
        setTimeout(fitAll, 500);
      });

      document.getElementById('btn-zoomin').addEventListener('click', () => {
        svg.transition().duration(300).call(zoom.scaleBy, 1.4);
      });

      document.getElementById('btn-zoomout').addEventListener('click', () => {
        svg.transition().duration(300).call(zoom.scaleBy, 0.7);
      });

      // ====== Info Panel ======
      function noteUrls() {
        return /https?:\/\/[^\s<>"，。；！？、（）「」【】]+/gi;
      }

      function noteLength(note) {
        return Array.from(note.replace(noteUrls(), '').trim()).length;
      }

      function updateNoteLimit(inputId, statusId) {
        const input = document.getElementById(inputId);
        const status = document.getElementById(statusId);
        const length = noteLength(input.value);
        status.textContent = length + ' / 1000 字（链接不计）' + (length > 1000 ? '，请缩短正文' : '');
        status.setAttribute('aria-invalid', String(length > 1000));
        input.setAttribute('aria-invalid', String(length > 1000));
        return length <= 1000;
      }

      function renderNote(note) {
        const container = document.getElementById('info-desc');
        container.replaceChildren();
        let offset = 0;
        for (const match of note.matchAll(noteUrls())) {
          container.append(note.slice(offset, match.index));
          const link = document.createElement('a');
          link.href = match[0];
          link.textContent = match[0];
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          container.append(link);
          offset = match.index + match[0].length;
        }
        container.append(note.slice(offset) || (!note ? '暂无备注信息' : ''));
      }

      document.getElementById('info-textarea').addEventListener('input', () =>
        updateNoteLimit('info-textarea', 'info-note-limit'));
      document.getElementById('add-note').addEventListener('input', () =>
        updateNoteLimit('add-note', 'add-note-limit'));

      function showInfoPanel(d) {
        if (saving) return;
        searchRevealVersion++;
        currentSelected = d;
        const panel = document.getElementById('info-panel');
        panel.style.display = 'block';
        refreshInfoPanel();
        setInfoEditMode(false);
        panel.scrollTop = 0;
      }

      function refreshInfoPanel() {
        if (!currentSelected) return;
        const data = currentSelected.data;
        document.getElementById('info-name').textContent = data.name || '';
        document.getElementById('info-gen').textContent = data.generation || '未填写世代';
        document.getElementById('info-descendants').textContent = `此人以下收录 ${countDescendants(data)} 人`;
        renderNote(data.note || '');
        document.getElementById('info-name-input').value = data.name || '';
        document.getElementById('info-gen-input').value = data.generation || '';
        document.getElementById('info-textarea').value = data.note || '';
        updateNoteLimit('info-textarea', 'info-note-limit');
        document.getElementById('info-delete-btn').style.visibility = data === DATA ? 'hidden' : 'visible';
      }

      function setInfoEditMode(enabled) {
        document.getElementById('info-panel').classList.toggle('is-editing', enabled);
        document.getElementById('info-edit-fields').style.display = enabled ? 'block' : 'none';
        document.getElementById('info-edit-actions').style.display = enabled ? 'grid' : 'none';
        document.getElementById('info-edit-btn').style.display = enabled ? 'none' : 'inline-block';
        if (!enabled && currentSelected) refreshInfoPanel();
      }

      function countDescendants(data) {
        if (!data._children_all) return 0;
        let count = data._children_all.length;
        data._children_all.forEach(c => { count += countDescendants(c); });
        return count;
      }

      document.getElementById('info-close').addEventListener('click', () => {
        if (saving) return;
        document.getElementById('info-panel').style.display = 'none';
        setInfoEditMode(false);
        currentSelected = null;
      });

      let editUnlocked = false;
      document.getElementById('info-edit-btn').addEventListener('click', () => {
        if (saving || !currentSelected || !requireWritableFile()) return;
        if (!IS_GITHUB_PAGES && !editUnlocked) {
          const pwd = prompt('请输入编辑密码：');
          if (pwd !== 'Lsb@1775') {
            alert('密码错误');
            return;
          }
          editUnlocked = true;
        }
        refreshInfoPanel();
        setInfoEditMode(true);
      });

      document.getElementById('info-save-btn').addEventListener('click', async () => {
        if (saving || !currentSelected || !requireWritableFile()) return;
        const name = document.getElementById('info-name-input').value.trim();
        if (!name) { alert('姓名不能为空'); return; }
        const generation = document.getElementById('info-gen-input').value.trim();
        const note = document.getElementById('info-textarea').value.trim();
        if (!updateNoteLimit('info-textarea', 'info-note-limit')) {
          document.getElementById('info-textarea').focus();
          return;
        }
        const data = currentSelected.data;
        const previous = {
          name: data.name,
          generation: data.generation,
          note: data.note
        };
        Object.assign(data, { name, generation, note });
        if (!await saveDataDirectly()) {
          Object.assign(data, previous);
          return;
        }
        render(null);
        updateStats();
        refreshInfoPanel();
        setInfoEditMode(false);
      });

      document.getElementById('info-cancel-btn').addEventListener('click', () => {
        if (!saving) setInfoEditMode(false);
      });

      // ====== Search ======
      const searchInput = document.getElementById('search-input');
      const searchResults = document.getElementById('search-results');
      const officialNameAliases = [
        ['吴国炳', '吳國柄', '吴国柄'],
        ['谈玉茹', '谈玉如', '談玉茹', '談玉如']
      ];
      const nameIndex = new WeakMap();
      let composingName = false;

      function compactPinyin(value) {
        return value.toLowerCase().normalize('NFKD')
          .replace(/u\u0308|u:/g, 'v').replace(/[\u0300-\u036f]/g, '')
          .replace(/[\s'’·._-]+/g, '').replace(/[1-5]/g, '');
      }

      function indexedNames(data) {
        const cached = nameIndex.get(data);
        if (cached && cached.name === data.name) return cached;
        const label = (data.name || '').normalize('NFKC').toLowerCase();
        const names = label.split(/[，,、；;：:（）()／/]+/)
          .map(part => part.trim().replace(/^(?:[一二三大]房\s*)?(?:[长次幼独一二三四五六七八九十]?(?:子|女)|妻|婿|配偶|继妻|继室|妾)\s*/, ''))
          .filter(Boolean);
        for (const aliases of officialNameAliases) {
          if (aliases.some(alias => label.includes(alias))) names.push(...aliases);
        }
        const entry = { name: data.name, label, names };
        nameIndex.set(data, entry);
        return entry;
      }

      function matchName(data, query, romanized) {
        const entry = indexedNames(data);
        if (entry.names.includes(query)) return 0;
        if (entry.label.includes(query) || entry.names.some(name => name.includes(query))) return 2;
        if (!romanized || !window.pinyinPro) return Infinity;
        if (!entry.pinyin) {
          entry.pinyin = entry.names.map(name => {
            const syllables = window.pinyinPro.pinyin(name, {
              mode: 'surname', toneType: 'none', type: 'array'
            }).map(compactPinyin);
            return [syllables.join(''), syllables.map(s => s.charAt(0)).join('')];
          });
        }
        if (entry.pinyin.some(([full]) => full === romanized)) return 0;
        if (entry.pinyin.some(([, initials]) => initials === romanized)) return 1;
        if (romanized.length >= 2 && entry.pinyin.some(([full]) => full.includes(romanized))) return 3;
        return Infinity;
      }

      function showNameResults() {
        const q = searchInput.value.trim().normalize('NFKC').toLowerCase();
        if (!q) {
          searchResults.style.display = 'none';
          return;
        }
        const pinyin = compactPinyin(q);
        const romanized = /^[a-z]+$/.test(pinyin) ? pinyin : '';
        const results = [];
        function searchTree(data) {
          const rank = matchName(data, q, romanized);
          if (rank < Infinity) results.push({ data, rank });
          if (data._children_all) data._children_all.forEach(searchTree);
        }
        searchTree(DATA);

        searchResults.replaceChildren();
        searchResults.style.display = 'block';
        if (results.length === 0) {
          const empty = document.createElement('div');
          empty.setAttribute('role', 'status');
          empty.className = 'search-item';
          empty.textContent = '未找到匹配的人名';
          searchResults.append(empty);
          return;
        }

        results.sort((a, b) => a.rank - b.rank).slice(0, 30).forEach(({ data: result }) => {
          const item = document.createElement('button');
          const generation = document.createElement('span');
          item.type = 'button';
          item.className = 'search-item';
          item.textContent = result.name;
          generation.className = 'gen';
          generation.textContent = result.generation || '';
          item.append(generation);
          item.addEventListener('click', () => {
            searchResults.style.display = 'none';
            if (compactTreeView.matches) searchInput.blur();
            navigateToNode(result.id);
          });
          searchResults.append(item);
        });
      }

      searchInput.addEventListener('compositionstart', () => {
        composingName = true;
        searchResults.style.display = 'none';
      });
      searchInput.addEventListener('compositionend', () => {
        composingName = false;
        showNameResults();
      });
      searchInput.addEventListener('input', event => {
        if (!composingName && !event.isComposing) showNameResults();
      });

      function pathTo(data, id) {
        if (data.id === id) return [data];
        for (const child of data._children_all || []) {
          const path = pathTo(child, id);
          if (path) return [data, ...path];
        }
        return null;
      }

      function navigateToNode(id) {
        if (saving) return;
        const path = pathTo(DATA, id);
        if (!path) return;
        const previousId = searchPair[searchPair.length - 1];
        const previousPath = previousId && previousId !== id ? pathTo(DATA, previousId) : null;
        if (previousId !== id) searchPair = previousPath ? [previousId, id] : [id];

        const firstPath = previousId === id && searchPair.length === 2
          ? pathTo(DATA, searchPair[0]) : previousPath;
        let common = 0;
        while (firstPath && path[common] && firstPath[common] === path[common]) common++;
        const branches = firstPath ? [firstPath.slice(common), path.slice(common)] : null;
        searchPath = new Set(branches ? branches.flat().map(person => person.id) : []);
        [...(firstPath || []).slice(0, -1), ...path.slice(0, -1)].forEach(person => {
          person._children_visible = person._children_all;
          person._expanded = true;
        });

        const hierarchy = render(null, branches);
        const target = findNodeInHierarchy(hierarchy, id);
        if (target) {
          const points = hierarchy.descendants().filter(node =>
            searchPair.includes(node.data.id) || searchPath.has(node.data.id));
          if (firstPath && common) {
            const ancestor = findNodeInHierarchy(hierarchy, path[common - 1].id);
            if (ancestor) points.push(ancestor);
          }
          const [minX, maxX] = d3.extent(points, node => node._x);
          const [minY, maxY] = d3.extent(points, node => node._y);
          document.getElementById('info-panel').style.display = 'none';
          currentSelected = null;
          function focusResult(duration) {
            const { top, bottom } = treeViewport();
            const scale = Math.min(1, width / (maxX - minX + 360),
              (bottom - top) / (maxY - minY + (compactTreeView.matches ? 90 : 200)));
            return centerOnNode((minX + maxX) / 2, (minY + maxY) / 2, scale, duration);
          }
          const version = searchRevealVersion;
          const pending = g.selectAll('.kinship-flower.is-blooming').nodes().map(flower =>
            new Promise(resolve => {
              flower.addEventListener('animationend', resolve, { once: true });
              flower.addEventListener('animationcancel', resolve, { once: true });
            }));
          const focus = focusResult(
            reduceKinshipMotion.matches ? 0 : SEARCH_FOCUS_MS);
          if (focus) pending.push(focus.end());

          function revealResult() {
            if (version !== searchRevealVersion) return;
            showInfoPanel(target);
            if (compactTreeView.matches) focusResult(0);
          }
          if (pending.length) Promise.allSettled(pending).then(revealResult);
          else revealResult();
        }
      }

      searchInput.addEventListener('keydown', event => {
        if (composingName || event.isComposing || event.keyCode === 229) return;
        if (event.key === 'Enter' && searchResults.style.display === 'block') {
          event.preventDefault();
          searchResults.querySelector('button.search-item')?.click();
        }
        if (event.key !== 'Escape') return;
        searchResults.style.display = 'none';
        searchPair = [];
        searchPath.clear();
        render(null);
      });

      // Click outside to close search
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#search-wrap')) {
          searchResults.style.display = 'none';
        }
      });

      // ====== Minimap ======
      const minimapCanvas = document.getElementById('minimap-canvas');
      const minimapCtx = minimapCanvas.getContext('2d');
      const minimapViewport = document.getElementById('minimap-viewport');
      const minimapContainer = document.getElementById('minimap-container');

      function updateMinimap() {
        const cw = minimapContainer.clientWidth;
        const ch = minimapContainer.clientHeight;
        if (!cw || !ch) return;
        const hierarchy = computeLayout();
        const nodes = hierarchy.descendants();
        if (nodes.length === 0) return;

        minimapCanvas.width = cw;
        minimapCanvas.height = ch;

        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        nodes.forEach(n => {
          if (n._x < minX) minX = n._x;
          if (n._x > maxX) maxX = n._x;
          if (n._y < minY) minY = n._y;
          if (n._y > maxY) maxY = n._y;
        });

        const pad = 20;
        const treeW = Math.max(maxX - minX, 1) + pad * 2;
        const treeH = Math.max(maxY - minY, 1) + pad * 2;
        const scaleX = cw / treeW;
        const scaleY = ch / treeH;
        const s = Math.min(scaleX, scaleY);

        minimapCtx.clearRect(0, 0, cw, ch);
        minimapCtx.fillStyle = 'rgba(212,175,55,0.3)';

        nodes.forEach(n => {
          const x = (n._x - minX + pad) * s;
          const y = (n._y - minY + pad) * s;
          minimapCtx.fillRect(x - 1, y - 1, 2, 2);
        });

        // Viewport rectangle
        const transform = d3.zoomTransform(svg.node());
        const viewLeft = -transform.x / transform.k;
        const viewTop = -transform.y / transform.k;
        const viewW = width / transform.k;
        const viewH = height / transform.k;

        const vx = (viewLeft - minX + pad) * s;
        const vy = (viewTop - minY + pad) * s;
        const vw = viewW * s;
        const vh = viewH * s;

        minimapViewport.style.left = Math.max(0, vx) + 'px';
        minimapViewport.style.top = Math.max(0, vy) + 'px';
        minimapViewport.style.width = Math.min(vw, cw) + 'px';
        minimapViewport.style.height = Math.min(vh, ch) + 'px';

        // Store for drag
        minimapContainer._treeRange = { minX: minX - pad, minY: minY - pad, treeW, treeH, scale: s };
      }

      // Minimap drag
      let minimapDragging = false;
      minimapContainer.addEventListener('mousedown', (e) => {
        minimapDragging = true;
        minimapJumpTo(e);
      });
      document.addEventListener('mousemove', (e) => {
        if (minimapDragging) minimapJumpTo(e);
      });
      document.addEventListener('mouseup', () => { minimapDragging = false; });

      function minimapJumpTo(e) {
        const rect = minimapContainer.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const range = minimapContainer._treeRange;
        if (!range) return;

        const treeX = mx / range.scale + range.minX;
        const treeY = my / range.scale + range.minY;

        const transform = d3.zoomTransform(svg.node());
        const tx = width / 2 - treeX * transform.k;
        const ty = height / 2 - treeY * transform.k;
        svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(transform.k));
      }

      function findParentData(root, targetId) {
        const children = root._children_all || [];
        for (const c of children) {
          if (c.id === targetId) return root;
          const found = findParentData(c, targetId);
          if (found) return found;
        }
        return null;
      }

      // ====== Add Node ======
      document.getElementById('info-add-child-btn').addEventListener('click', () => {
        if (saving || !currentSelected || !requireWritableFile()) return;
        const parentData = currentSelected.data;
        document.getElementById('add-dialog-title').textContent = '为「' + (parentData.name || '') + '」添加子节点';
        document.getElementById('add-name').value = '';
        document.getElementById('add-gen').value = '';
        document.getElementById('add-note').value = '';
        updateNoteLimit('add-note', 'add-note-limit');
        const overlay = document.getElementById('add-node-overlay');
        overlay.style.display = 'flex';
        overlay._parentData = parentData;
        setTimeout(() => document.getElementById('add-name').focus(), 100);
      });

      document.getElementById('add-confirm').addEventListener('click', async () => {
        const overlay = document.getElementById('add-node-overlay');
        const parentData = overlay._parentData;
        if (saving || !parentData || !requireWritableFile()) return;
        const name = document.getElementById('add-name').value.trim();
        if (!name) { alert('请输入姓名'); return; }
        const gen = document.getElementById('add-gen').value.trim();
        const note = document.getElementById('add-note').value.trim();
        if (!updateNoteLimit('add-note', 'add-note-limit')) {
          document.getElementById('add-note').focus();
          return;
        }
        const newId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        const newNode = {
          name: name,
          id: newId,
          generation: gen,
          note: note,
          children: [],
          _children_all: null,
          _children_visible: null,
          _expanded: false,
          dc: 0,
          depth: (parentData.depth || 0) + 1
        };
        const originalChildren = parentData._children_all;
        const originallyExpanded = parentData._expanded;
        parentData._children_all = [...(originalChildren || []), newNode];
        parentData._children_visible = parentData._children_all;
        parentData._expanded = true;
        if (!await saveDataDirectly()) {
          parentData._children_all = originalChildren;
          parentData._expanded = originallyExpanded;
          parentData._children_visible = originallyExpanded ? originalChildren : null;
          return;
        }
        // Re-render
        render(null);
        overlay.style.display = 'none';
        // Update stats
        updateStats();
        refreshInfoPanel();
      });

      document.getElementById('add-cancel').addEventListener('click', () => {
        if (!saving) document.getElementById('add-node-overlay').style.display = 'none';
      });

      document.getElementById('add-node-overlay').addEventListener('click', (e) => {
        if (!saving && e.target === e.currentTarget) e.currentTarget.style.display = 'none';
      });

      // ====== Delete Node ======
      document.getElementById('info-delete-btn').addEventListener('click', async () => {
        if (saving || !currentSelected || !requireWritableFile()) return;
        const nodeData = currentSelected.data;
        if (nodeData === DATA) { alert('不能删除根节点'); return; }
        const childCount = countDescendants(nodeData);
        const msg = childCount > 0
          ? '确定要删除「' + nodeData.name + '」及其 ' + childCount + ' 位后代吗？\n\n此操作不可撤销。'
          : '确定要删除「' + nodeData.name + '」吗？\n\n此操作不可撤销。';
        if (!confirm(msg)) return;
        // Find parent and remove
        const parent = findParentData(DATA, nodeData.id);
        if (!parent) return;
        const originalChildren = parent._children_all;
        const originallyExpanded = parent._expanded;
        if (parent._children_all) {
          parent._children_all = parent._children_all.filter(c => c.id !== nodeData.id);
          if (parent._children_all.length === 0) {
            parent._children_all = null;
            parent._children_visible = null;
            parent._expanded = false;
          } else if (parent._expanded) {
            parent._children_visible = parent._children_all;
          }
        }
        if (!await saveDataDirectly()) {
          parent._children_all = originalChildren;
          parent._expanded = originallyExpanded;
          parent._children_visible = originallyExpanded ? originalChildren : null;
          return;
        }
        searchPair = searchPair.filter(id => pathTo(DATA, id));
        if (searchPair.length < 2) searchPath.clear();
        // Re-render
        render(null);
        document.getElementById('info-panel').style.display = 'none';
        currentSelected = null;
        updateStats();
      });

      // Update stats display
      function updateStats() {
        const allNodes = [];
        const genSet = new Set();
        function walk(n) {
          allNodes.push(n);
          if (n.generation) genSet.add(n.generation);
          if (n._children_all) n._children_all.forEach(walk);
        }
        walk(DATA);
        document.getElementById('stats-line').textContent =
          '共 ' + allNodes.length + ' 人 · ' + genSet.size + ' 代';
      }

      // ====== Initial Render ======
      // Expand root by default
      DATA._children_visible = DATA._children_all;
      DATA._expanded = true;
      render(null);
      setTimeout(() => { if (!searchPair.length) fitAll(); }, 600);
    }
  </script>
</body>

</html>
